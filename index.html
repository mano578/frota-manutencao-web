<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#10b981">
    <title>INOVAR - Gestão de Frota</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./src/styles/global.css">
    <link rel="stylesheet" href="./src/styles/responsive.css">
</head>
<body>
    <!-- TELA DE LOGIN -->
    <div id="tela-login" class="tela-login-container">
        <div class="login-box">
            <div class="login-logo">
                <i class="fas fa-truck-front"></i>
            </div>
            <h1>INOVAR</h1>
            <p>Soluções Ambientais LTDA</p>
            
            <form id="form-login" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>E-mail ou Usuário</label>
                    <input type="text" id="input-usuario" placeholder="seu@email.com" required>
                </div>
                
                <div class="input-group">
                    <label>Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="input-senha" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="chk-manter">
                    <label for="chk-manter">Manter conectado</label>
                </div>
                
                <button type="submit" class="btn-login" id="btn-login">
                    <span class="btn-text">Acessar Sistema</span>
                    <span class="loader-spinner"></span>
                </button>
                
                <div id="login-erro" class="erro-msg"></div>
            </form>
            
            <div class="login-footer">
                <button type="button" class="link-recuperar" onclick="abrirRecuperarSenha()">
                    Esqueceu a senha?
                </button>
            </div>
        </div>
    </div>

    <!-- SISTEMA PRINCIPAL -->
    <div id="sistema-principal" class="app-container" style="display: none;">
        <div id="overlay-menu" class="overlay-menu" onclick="fecharMenu()"></div>
        
        <!-- SIDEBAR MOBILE -->
        <div class="mobile-header">
            <button class="btn-menu-mobile" onclick="abrirMenu()">
                <i class="fas fa-bars"></i> Menu
            </button>
            <span class="mobile-title">INOVAR</span>
            <button class="btn-sync" onclick="sincronizarAbaAtual()">
                <i class="fas fa-sync"></i>
            </button>
        </div>
        
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fas fa-leaf"></i>
                <h2>INOVAR</h2>
            </div>
            
            <nav class="menu-navegacao">
                <a class="menu-item" data-aba="painel" onclick="alternarAba('painel')">
                    <i class="fas fa-chart-line"></i> Painel Geral
                </a>
                <a class="menu-item" data-aba="frota" onclick="alternarAba('frota')">
                    <i class="fas fa-car"></i> Frota
                </a>
                <a class="menu-item" data-aba="manutencao" onclick="alternarAba('manutencao')">
                    <i class="fas fa-tools"></i> Manutenção
                </a>
                <a class="menu-item" data-aba="abastecimento" onclick="alternarAba('abastecimento')">
                    <i class="fas fa-gas-pump"></i> Abastecimento
                </a>
                <a class="menu-item" data-aba="custos" onclick="alternarAba('custos')">
                    <i class="fas fa-receipt"></i> Custos
                </a>
                <a class="menu-item" data-aba="relatorios" onclick="alternarAba('relatorios')">
                    <i class="fas fa-file-pdf"></i> Relatórios
                </a>
                <hr class="menu-divider">
                <a class="menu-item" data-aba="admin" id="menu-admin" onclick="alternarAba('admin')" style="display:none;">
                    <i class="fas fa-crown"></i> Admin
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div class="user-details">
                        <span class="user-name" id="nome-usuario">Usuário</span>
                        <span class="user-status">Online</span>
                    </div>
                </div>
                <button class="btn-logout" onclick="fazerLogout()">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </aside>
        
        <!-- CONTEÚDO PRINCIPAL -->
        <main class="main-content">
            <!-- ABAS DO SISTEMA -->
            <div id="aba-painel" class="aba-tela ativa"></div>
            <div id="aba-frota" class="aba-tela"></div>
            <div id="aba-manutencao" class="aba-tela"></div>
            <div id="aba-abastecimento" class="aba-tela"></div>
            <div id="aba-custos" class="aba-tela"></div>
            <div id="aba-relatorios" class="aba-tela"></div>
            <div id="aba-admin" class="aba-tela"></div>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./src/js/main.js"></script>
</body>
</html>
